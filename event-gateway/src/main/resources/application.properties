spring.application.name=event-gateway
server.port=8082

# H2 in-memory database
spring.datasource.url=jdbc:h2:mem:gatewaydb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Account Service URL (overridden in Docker Compose)
account-service.url=${ACCOUNT_SERVICE_URL:http://localhost:8081}

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always

# OpenTelemetry tracing (endpoint set via MANAGEMENT_OTLP_TRACING_ENDPOINT env var in Docker)
management.tracing.sampling.probability=1.0
management.tracing.propagation.type=w3c

# --- Resilience4j: Circuit Breaker ---
# Sliding window of 10 calls; open circuit if >= 50% fail
resilience4j.circuitbreaker.instances.accountService.sliding-window-size=10
resilience4j.circuitbreaker.instances.accountService.failure-rate-threshold=50
# Stay open for 30s before probing with half-open calls
resilience4j.circuitbreaker.instances.accountService.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.accountService.permitted-number-of-calls-in-half-open-state=3
# Slow calls (> 3s) count as failures too
resilience4j.circuitbreaker.instances.accountService.slow-call-duration-threshold=3s
resilience4j.circuitbreaker.instances.accountService.slow-call-rate-threshold=80

# --- Resilience4j: Retry ---
# 2 retries (3 attempts total), exponential backoff starting at 500ms
resilience4j.retry.instances.accountService.max-attempts=3
resilience4j.retry.instances.accountService.wait-duration=500ms
resilience4j.retry.instances.accountService.enable-exponential-backoff=true
resilience4j.retry.instances.accountService.exponential-backoff-multiplier=2
resilience4j.retry.instances.accountService.randomized-wait-factor=0.5

# --- REST client timeout ---
account-service.connect-timeout=2s
account-service.read-timeout=5s

# --- Event Replay (async fallback queue) ---
event.replay.interval=30000
event.replay.max-retries=5

# --- Resilience4j: Rate Limiter (gateway ingress) ---
# 50 requests per 1-second window; fail fast (no queue)
resilience4j.ratelimiter.instances.gateway.limit-for-period=50
resilience4j.ratelimiter.instances.gateway.limit-refresh-period=1s
resilience4j.ratelimiter.instances.gateway.timeout-duration=0s
