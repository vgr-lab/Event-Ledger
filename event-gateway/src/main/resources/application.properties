spring.application.name=event-gateway
server.port=8082

# H2 in-memory database
spring.datasource.url=jdbc:h2:mem:gatewaydb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Account Service URL (overridden in Docker Compose)
account-service.url=${ACCOUNT_SERVICE_URL:http://localhost:8081}

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# OpenTelemetry tracing
management.tracing.sampling.probability=1.0
management.otlp.tracing.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces
