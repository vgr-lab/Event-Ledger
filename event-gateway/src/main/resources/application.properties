spring.application.name=event-gateway
server.port=8082

# H2 in-memory database
spring.datasource.url=jdbc:h2:mem:gatewaydb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Account Service URL (overridden in Docker Compose)
account-service.url=${ACCOUNT_SERVICE_URL:http://localhost:8081}

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# OpenTelemetry tracing (endpoint set via MANAGEMENT_OTLP_TRACING_ENDPOINT env var in Docker)
management.tracing.sampling.probability=1.0
management.tracing.propagation.type=w3c

# Structured logging with trace context
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSS} %5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}] [%t] %-40.40logger{39} : %m%n
